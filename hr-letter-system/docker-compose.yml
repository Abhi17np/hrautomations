version: '3.9'
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      - MONGO_URI=mongodb://mongo:27017/hr_offer_letters
      - JWT_SECRET_KEY=change-me-in-production
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=abhishekst1713@gmail.com
      - SMTP_PASS=cqjmpxjclpethdhm
      - SMTP_FROM=abhishekst1713@gmail.com
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
