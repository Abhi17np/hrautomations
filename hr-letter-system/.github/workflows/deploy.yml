name: Deploy to Google Cloud Run

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  BACKEND_IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/hr-backend
  FRONTEND_IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/hr-frontend

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Build and push backend image
      run: |
        gcloud builds submit --tag ${{ env.BACKEND_IMAGE }} ./backend

    - name: Deploy backend to Cloud Run
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: hr-backend
        image: ${{ env.BACKEND_IMAGE }}
        platform: managed
        region: us-central1
        port: 5050
        allow-unauthenticated: true
        env_vars: |
          FLASK_ENV=production
          MONGO_URI=${{ secrets.MONGO_URI }}
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}
          SMTP_FROM=${{ secrets.SMTP_FROM }}
          COMPANY_NAME=${{ secrets.COMPANY_NAME }}

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Get backend URL
      id: backend-url
      run: |
        BACKEND_URL=$(gcloud run services describe hr-backend --region=us-central1 --format="value(status.url)")
        echo "backend_url=$BACKEND_URL" >> $GITHUB_OUTPUT

    - name: Build and push frontend image
      run: |
        gcloud builds submit --tag ${{ env.FRONTEND_IMAGE }} ./frontend

    - name: Deploy frontend to Cloud Run
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: hr-frontend
        image: ${{ env.FRONTEND_IMAGE }}
        platform: managed
        region: us-central1
        port: 80
        allow-unauthenticated: true
        env_vars: |
          BACKEND_URL=${{ steps.backend-url.outputs.backend_url }}